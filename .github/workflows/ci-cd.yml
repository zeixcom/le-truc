name: CI/CD Pipeline

on:
  push:
    branches: [main, next]
    tags: ['v*']
  pull_request:
    branches: [main, next]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Bundle size regression
        run: bun run check:size

      - name: Generate & verify Custom Elements Manifest
        # Guards against silent plugin-load failure: if @zeix/cem-plugin-le-truc
        # fails to load, cem analyze still exits 0 but emits garbage declarations.
        # verify-cem.ts asserts all declaration names are PascalCase (plugin-ran signal).
        run: bun run build:cem

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run tests
        run: bun run test

      - name: Run server tests
        run: bun run test:server

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
