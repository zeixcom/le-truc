name: CI/CD Pipeline

on:
  push:
    branches: [main, next]
    tags: ['v*']
  pull_request:
    branches: [main, next]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (not "latest"): the bundle-size regression test runs the
          # minifier against a hard ceiling (REQUIREMENTS.md §4) with only a
          # ~100B margin. Bun version drift changes minifier output by enough
          # to flip that assertion — pin so CI matches what's tested locally.
          bun-version: 1.3.11
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        # Root tsconfig covers examples/ and test/ on top of src/ — the build's
        # tsconfig.build.json only checks src/, and bun's bundler transpiles
        # examples without checking, so this is the only gate over all of it.
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Bundle size regression
        run: bun run check:size

      - name: Generate & verify Custom Elements Manifest
        # Guards against silent plugin-load failure: if @zeix/cem-plugin-le-truc
        # fails to load, cem analyze still exits 0 but emits garbage declarations.
        # verify-cem.ts asserts all declaration names are PascalCase (plugin-ran signal).
        run: bun run build:cem

      - name: Build documentation site
        # docs/ is gitignored; Playwright tests are served from it
        # (serve:examples only rebuilds docs/assets, not the HTML pages).
        run: bun run build:docs

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run tests
        run: bun run test

      - name: Run variant spec matrix
        # ADR 0039 s2: the spec is the runtime equivalence contract across a
        # variant set's spellings. `bun run test` covers only the served
        # surface; this reruns each variant set's spec per spelling (.ts twin,
        # .tsrx, .tsx). Port 3000 is free again once the previous step's
        # webServer exits; that step already built the examples.
        run: bun run test:variants --no-build

      - name: Run server tests
        run: bun run test:server

      - name: Check doc links
        # Validates internal links and anchors in adr/*.md, ARCHITECTURE.md,
        # REQUIREMENTS.md, AGENTS.md — catches rotted paths and stale anchors.
        # Runs after tests so its wall-clock cost doesn't pressure the
        # time-sensitive Playwright specs (esp. WebKit route.fetch in CI).
        run: bun run check:links

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  test-no-substrate:
    # The second supported configuration (ADR 0034 s5, M28): the compiler
    # exercised WITHOUT the optional simulation substrate. The `test` job
    # above covers the with-substrate configuration.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Remove the simulation substrate
        # jsdom is an optional peer dependency: a consumer whose install line
        # skips it never sees the package. Deleting it reproduces exactly
        # that configuration — the driver resolves, its substrate import
        # fails with ERR_MODULE_NOT_FOUND for `jsdom`, and the build must
        # treat that as absence, not as a broken install.
        run: rm -rf node_modules/jsdom

      - name: Build the corpus without the substrate
        # The one-shot build runs the simulation pass after the compile
        # (build.ts orders it): must stay green with the Simulated-tier
        # components routed Static and named in the census — never a failed
        # build. Piped through tee so the census assertion below can read
        # the report; pipefail keeps a build failure failing this step.
        shell: bash
        run: set -o pipefail; bun run build:docs 2>&1 | tee no-substrate-build.log

      - name: The census records the routing outcome
        run: grep -q "unavailable-substrate" no-substrate-build.log
