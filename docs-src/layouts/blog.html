<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{{ title }} – Le Truc Blog</title>
		<meta name="description" content="{{ description }}">
		<meta name="author" content="{{ author }}">
		<meta name="article:published_time" content="{{ published-date }}">
		<meta name="article:modified_time" content="{{ modified-date }}">
		<link
			rel="preload"
			href="{{ base-path }}assets/main.css?v={{ css-hash }}"
			as="style"
		>
		<link
			rel="modulepreload"
			href="{{ base-path }}assets/main.js?v={{ js-hash }}"
		>
		<link
			rel="stylesheet"
			href="{{ base-path }}assets/main.css?v={{ css-hash }}"
		>
		<script
			type="module"
			src="{{ base-path }}assets/main.js?v={{ js-hash }}"
		></script>
		<link rel="alternate" type="text/markdown" title="Agent-readable content" href="{{ alternate-link }}">
	</head>
	<body class="blog">
		<context-router>
			<header class="content-grid">
				<a href="#main" class="skiplink visually-hidden">
					Skip to main content
				</a>
				<div class="breakout docs-header-bar">
					<h1>
						Le Truc <small><a href="{{ base-path }}blog.html">Blog</a></small>
					</h1>
					<nav class="quicklinks">
						<a href="{{ base-path }}llms.txt">llms.txt</a>
						<a href="https://github.com/zeixcom/le-truc" target="_blank" rel="noopener">
							<img src="{{ base-path }}assets/img/github.svg" alt="GitHub repository" width="16" height="16">
						</a>
						<a href="https://www.npmjs.com/package/@zeix/le-truc" target="_blank" rel="noopener">
							<img src="{{ base-path }}assets/img/npmjs.png" alt="npm package" width="16" height="16">
						</a>
					</nav>
					<button
						type="button"
						id="sidebar-toggle"
						class="sidebar-toggle"
						aria-expanded="false"
						aria-controls="sidebar"
					>
						<span class="visually-hidden">Toggle menu</span>
						☰
					</button>
				</div>
				<card-callout class="content danger" hidden>
					<p class="error" role="alert" aria-live="assertive"></p>
				</card-callout>
			</header>

			<div class="docs-body">
				{{ menu }}
				<main
					id="main"
					class="content-grid"
					itemscope
					itemtype="https://schema.org/BlogPosting"
				>
					<section-hero>
						<h1 itemprop="headline">{{ title }}</h1>
						<div class="hero-layout">
							<div class="lead">
								<basic-blogmeta>
									<span
										class="author"
										itemprop="author"
										itemscope
										itemtype="https://schema.org/Person"
									>
										<img class="avatar" src="{{ author-avatar }}" alt="Avatar of {{ author }}">
										<span itemprop="name">{{ author }}</span>
									</span>
									<span>
										<time class="published" itemprop="datePublished" datetime="{{ published-date }}">
											{{ published-date }}
										</time>
										<span class="modified">
											· updated on
											<time itemprop="dateModified" datetime="{{ modified-date }}">
												{{ modified-date }}
											</time>
										</span>
									</span>
									<span>
										<meta itemprop="timeRequired" content="PT{{ reading-time }}M">{{ reading-time }} min read
									</span>
								</basic-blogmeta>
								<p itemprop="description">{{ description }}</p>
							</div>
						</div>
					</section-hero>
					{{ content }}
				</main>
			</div>

			<footer class="content-grid">
				<div class="breakout">
					<h2 class="visually-hidden">Footer</h2>
					<p>
						© 2024 – 2026
						<a href="https://zeix.com" target="_blank" rel="noopener" aria-label="Zeix AG">
							<svg viewBox="0 0 204 82" width="102" height="41" xmlns="http://www.w3.org/2000/svg" fill="#2A1C42" aria-hidden="true" focusable="false">
								<path d="m74.30032 60.53063-17.7379-10.23517 17.73463-28.86521-37.14853-21.43025-37.14852 21.43025 33.88904 19.54993-33.88904 19.55045 37.08332 21.46937.00086-.00139.00239.00139 37.21376-21.46937zm-67.77846-39.10038 30.62666-17.66684 30.62485 17.66905-30.62817 17.66927zm61.84503 3.42421-32.39883 52.73372-29.45273-17.05103zm-13.51451 28.22429h.00301l12.91981 7.45514-27.11138 15.64015 14.18857-23.09529zm132.26443-2.64436-11.39574 9.90168.06525.10664h5.24929l8.82493-7.63632 8.82166 7.63308h5.21666l.10114-.10018-11.43489-9.90491 10.73347-9.31999-.06852-.10341h-5.21339l-8.15613 7.01584-8.15613-7.01584h-5.21666l-.09787.10341 10.72692 9.31999zm-20.37727-13.6956h-4.29665v-3.54832h4.29665zm-.27405 4.2722h-3.67026v19.38971h3.67026zm-28.33765-1.1957c-7.87556 0-13.41193 4.49195-13.41193 10.7419 0 5.86216 5.16446 11.25573 14.48528 11.25573 4.02913.12926 8.06151-.7465 11.63717-2.59176v-3.80362l-.13376-.06463c-3.3538 2.29445-7.4025 3.42875-11.47078 3.28333-6.0127 0-9.91133-3.36735-10.3126-7.23559h22.89262c.51221-5.31925-2.94599-11.58535-13.68924-11.58535h.00326zm-9.20338 8.40867c0-2.47219 4.07154-5.28046 9.36976-5.28046s9.38281 2.20397 9.38281 5.28046zm-38.48061-3.98458v-3.22515h27.01962l.14681.07433-19.90422 16.09023h18.2893v3.22839h-27.94289l-.06525-.10018 20.22068-16.06114h-17.76731v-.00646h.00326z"></path>
							</svg>
						</a>
					</p>
				</div>
			</footer>
		</context-router>
	</body>
</html>
