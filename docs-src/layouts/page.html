<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{ title }} – Le Truc Docs</title>
		<meta name="description" content="{{ description }}">
		<link
			rel="preload"
			href="{{ base-path }}assets/main.css?v={{ css-hash }}"
			as="style"
		>
		<link
			rel="modulepreload"
			href="{{ base-path }}assets/main.js?v={{ js-hash }}"
		>
		<link
			rel="stylesheet"
			href="{{ base-path }}assets/main.css?v={{ css-hash }}"
		>
		<script
			type="module"
			src="{{ base-path }}assets/main.js?v={{ js-hash }}"
		></script>
		<link rel="alternate" type="text/markdown" title="Agent-readable content" href="{{ alternate-link }}">
	</head>

	<body class="{{ section }}">
		<context-router>
			<header class="content-grid">
				<a href="#main" class="skiplink visually-hidden">
					Skip to main content
				</a>
				<div class="content docs-header-bar">
					<h1>Le Truc Docs <small>{{ version }}</small></h1>
					<button
						type="button"
						id="sidebar-toggle"
						class="sidebar-toggle"
						aria-expanded="false"
						aria-controls="sidebar"
					>
						<span class="visually-hidden">Toggle menu</span>
						☰
					</button>
				</div>
				<card-callout class="content danger" hidden>
					<p class="error" role="alert" aria-live="assertive"></p>
				</card-callout>
			</header>

			<div class="docs-body">
				{{ menu }}
				<main id="main" class="content-grid">{{ content }}{{ chapter-nav }}</main>
			</div>

			<footer class="content-grid">
				<div class="content">
					<h2 class="visually-hidden">Footer</h2>
					<p>© 2024 – 2026 Zeix AG</p>
				</div>
			</footer>
		</context-router>
	</body>
</html>
