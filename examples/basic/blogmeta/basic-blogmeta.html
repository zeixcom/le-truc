<!-- Typed byline props (LT-095): the page renderer expands each occurrence
     with the component's server render at build time. `lang` is the
     occurrence's own locale: the single-copy examples tree has no page
     locale, and an occurrence without one stays unrendered. -->
<basic-blogmeta
	lang="en"
	author="Esther Brunner"
	avatar="./assets/img/avatar/esther-brunner.jpg"
	published="2026-03-09"
	reading-time="5"
></basic-blogmeta>

<br>

	published="2026-04-04"
	modified="2026-04-08"
	reading-time="7"
></basic-blogmeta>

<basic-blogmeta lang="en" author="Anonymous" published="2026-05-01"></basic-blogmeta>
