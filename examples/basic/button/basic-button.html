<basic-button>
	<button type="button" class="secondary medium">
		<span class="label">🛒 Shopping Cart</span>
		<span class="badge">5</span>
	</button>
</basic-button>

<hr>

<!-- Property changes example - tests direct property manipulation -->
<basic-button id="property-test">
	<button type="button" class="secondary large">
		<span class="label">🛒 Shopping Cart</span>
		<span class="badge">5</span>
	</button>
</basic-button>

<hr>

<!-- Missing elements example - tests graceful handling when .label/.badge spans are missing -->
<basic-button id="missing-elements-test">
	<button type="button" class="tertiary small">Just Button Text</button>
</basic-button>

<hr>

<!-- Text fallback example - tests label property fallback to button text content -->
<basic-button id="text-fallback-test">
	<button type="button" class="primary medium">Button Text Only</button>
</basic-button>

<hr>

<!-- Extra page-authored classes example - tests that a token selector still
	 finds `.label` when the page adds its own classes to the same span (LT-124) -->
<basic-button id="extra-class-test">
	<button type="button" class="secondary medium">
		<span class="label icon">🛒 Shopping Cart</span>
		<span class="badge highlight">5</span>
	</button>
</basic-button>

<hr>

<!-- Boolean attribute variations example - tests '', 'false', 'disabled', '0', and removeAttribute -->
<basic-button id="boolean-test">
	<button type="button" class="constructive medium">
		<span class="label">Boolean Test</span>
		<span class="badge">Test</span>
	</button>
</basic-button>
