<!-- Children-are-data (LT-112): the heading text lives in the owned h5 and
     the values in the dl structure the compiled client hydrates — label is a
     server-render arg, inert on the client, so the demo carries no
     attribute copy of the heading. -->
<card-mediaqueries>
	<h5>Without Context</h5>
	<dl>
		<dt>Motion Preference:</dt>
		<dd class="motion"></dd>
		<dt>Theme Preference</dt>
		<dd class="theme"></dd>
		<dt>Device Viewport:</dt>
		<dd class="viewport"></dd>
		<dt>Device Orientation:</dt>
		<dd class="orientation"></dd>
	</dl>
</card-mediaqueries>

<context-media>
	<card-mediaqueries>
		<h5>With Context</h5>
		<dl>
			<dt>Motion Preference:</dt>
			<dd class="motion"></dd>
			<dt>Theme Preference</dt>
			<dd class="theme"></dd>
			<dt>Device Viewport:</dt>
			<dd class="viewport"></dd>
			<dt>Device Orientation:</dt>
			<dd class="orientation"></dd>
		</dl>
	</card-mediaqueries>
</context-media>
