<!-- Lifecycle playground — connect and disconnect a real component -->
<docs-lifecycle>
	<div class="stage">
		<docs-pulse>
			<span class="instance"></span>
			<span class="ticks"></span>
		</docs-pulse>
	</div>
	<div class="controls">
		<basic-button>
			<button class="connect constructive" type="button" disabled>Connect</button>
		</basic-button>
		<basic-button>
			<button class="disconnect destructive" type="button">Disconnect</button>
		</basic-button>
	</div>
	<ol class="log"></ol>
</docs-lifecycle>
