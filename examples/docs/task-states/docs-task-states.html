<!-- Task state playground — one Task, all four match() branches -->
<docs-task-states>
	<div class="states" data-state="" role="status">
		<span class="state nil">nil</span>
		<span class="state err">err</span>
		<span class="state stale">stale</span>
		<span class="state ok">ok</span>
	</div>
	<output class="value">no value resolved yet</output>
	<p class="error" role="alert" hidden></p>
	<div class="controls">
		<basic-button>
			<button class="fetch constructive" type="button">Fetch</button>
		</basic-button>
		<form-checkbox class="checkbox">
			<label>
				<input type="checkbox" class="fail visually-hidden">
				<span class="label">Let the next fetch fail</span>
			</label>
		</form-checkbox>
	</div>
	<ol class="log"></ol>
</docs-task-states>
