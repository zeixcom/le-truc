<form-radiogroup name="gender">
	<fieldset>
		<legend>Gender</legend>
		<label>
			<input type="radio" value="female">
			<span>Female</span>
		</label>
		<label>
			<input type="radio" value="male">
			<span>Male</span>
		</label>
		<label class="selected">
			<input type="radio" value="other" checked>
			<span>Other</span>
		</label>
	</fieldset>
</form-radiogroup>

<hr>

<form-radiogroup class="radio-group" name="theme">
	<fieldset>
		<legend>Theme</legend>
		<label>
			<input type="radio" class="visually-hidden" value="light">
			<span>Light</span>
		</label>
		<label>
			<input type="radio" class="visually-hidden" value="dark">
			<span>Dark</span>
		</label>
		<label class="selected">
			<input
				type="radio"
				class="visually-hidden"
				value="system"
				checked
			>
			<span>Use system preference</span>
		</label>
	</fieldset>
</form-radiogroup>

<hr>

<form-radiogroup class="split-button" name="filter">
	<fieldset>
		<legend class="visually-hidden">Filter</legend>
		<label class="selected">
			<input
				type="radio"
				class="visually-hidden"
				value="all"
				checked
			>
			<span>All</span>
		</label>
		<label>
			<input
				type="radio"
				class="visually-hidden"
				value="active"
			>
			<span>Active</span>
		</label>
		<label>
			<input
				type="radio"
				class="visually-hidden"
				value="completed"
			>
			<span>Completed</span>
		</label>
	</fieldset>
</form-radiogroup>
