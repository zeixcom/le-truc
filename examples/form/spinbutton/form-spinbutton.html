<!-- Regenerated from the compiled template (LT-118): every instance below is
     what `renderFormSpinbutton()` emits for its args, so the served DOM and the
     client's harvest agree. value/min/max/step live on the owned input
     (children-are-data, LT-112); `zero` opts an instance into the "Add to Cart"
     zero-state affordance and is harvested from its own `.zero` span — at value
     0 the input and decrement button are `hidden`, the increment button carries
     the call-to-action label, and `.other` hides. -->

<form-spinbutton id="default-test" name="amount" value="0" min="0" max="10" step="1" bigStep="10">
	<label for="amount-input">Amount</label>
	<fieldset>
		<div class="input">
			<button type="button" aria-label="Decrement" hidden disabled class="decrement">−</button>
			<input id="amount-input" type="number" value="0" min="0" max="10" step="1" hidden class="value">
			<button type="button" class="increment">
				<span class="zero">Add to Cart</span>
				<span hidden class="other">+</span>
			</button>
		</div>
	</fieldset>
	<p role="alert" aria-live="assertive" class="error">
	</p>
</form-spinbutton>

<hr>

<!-- Different max value, zero-state opted in -->
