<!-- Children-are-data (LT-112): value/min/max/step live on the owned input
     (the hand-written contract); a host attribute overrides per the Parser's
     own precedence. bigStep has no input attribute — it stays on the host.
     The hand-written twin's zero-state affordance (.zero/.other spans) is
     still dropped pending a compiler capability (NOTES.md) — the compiled
     template always renders the plain input + step buttons. -->
<form-spinbutton id="default-test" name="amount">
	<label for="amount-input">Amount</label>
	<fieldset>
		<div class="input">
			<button type="button" class="decrement" aria-label="Decrement" disabled>−</button>
			<input id="amount-input" type="number" value="0" min="0" max="10" step="1">
			<button type="button" class="increment" aria-label="Increment">+</button>
		</div>
	</fieldset>
	<p class="error" role="alert" aria-live="assertive"></p>
</form-spinbutton>

<hr>
