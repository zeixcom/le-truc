<!-- Attribute-configured usage (LT-092 cutover): the compiled component owns
     its template. The description paragraph carries the template string in
     data-remaining ({n} is replaced by the remaining count); ids follow the
     {name}-input/{name}-error/{name}-description convention the compiled
     template derives. -->
<form-textbox name="name">
	<label for="name-input">Name</label>
	<div class="input">
		<input
			type="text"
			id="name-input"
			autocomplete="name"
			aria-describedby="name-description name-error"
			required
		>
	</div>
	<p class="error" role="alert" aria-live="assertive" id="name-error"></p>
	<p
		class="description"
		aria-live="polite"
		id="name-description"
		data-remaining="Tell us how you want us to call you in our communications."
	></p>
</form-textbox>

<hr>

<form-textbox name="query">
	<label for="query-input">Search terms</label>
	<div class="input">
		<input
			type="text"
			id="query-input"
			autocomplete="off"
			placeholder="apple banana"
			aria-describedby="query-error"
			required
		>
		<button type="button" class="clear" aria-label="Clear input" hidden>
			✕
		</button>
	</div>
	<p class="error" role="alert" aria-live="assertive" id="query-error"></p>
</form-textbox>

<hr>

<form-textbox name="comment">
	<label for="comment-input">Comment</label>
	<div class="input">
		<textarea
			id="comment-input"
			autocomplete="off"
			maxlength="500"
			rows="3"
			aria-describedby="comment-description comment-error"
		></textarea>
	</div>
	<p class="error" role="alert" aria-live="assertive" id="comment-error"></p>
	<p
		class="description"
		aria-live="polite"
		id="comment-description"
		data-remaining="{n} characters remaining"
	></p>
</form-textbox>
