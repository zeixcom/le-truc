<!-- Children-are-data (LT-146): the description seed is harvested directly
     from the owned paragraph's textContent (expose() auto-wraps the read
     into a reactive cell; no host attribute or data-* duplication needed). -->
<form-tokenbox>
  <label for="fruits-input">Fruits</label>
  <div class="input" data-container>
    <input type="text" id="fruits-input" data-unreconciled>
  </div>
  <template>
    <span class="token" data-key>
      <span class="token-label"><slot></slot></span>
      <button type="button" class="remove" aria-label="Remove">✕</button>
    </span>
  </template>
  <p class="error" role="alert" aria-live="assertive" id="fruits-error"></p>
  <p class="description" aria-live="polite" id="fruits-description"></p>
  <p class="status visually-hidden" role="status" aria-live="polite"></p>
</form-tokenbox>

<hr>

<form-tokenbox name="recipients">
  <label for="recipients-input">Recipients</label>
  <div class="input" data-container>
    <input
      type="email"
      id="recipients-input"
      placeholder="name@example.com"
      data-unreconciled
    >
  </div>
  <template>
    <span class="token" data-key>
      <span class="token-label"><slot></slot></span>
      <button type="button" class="remove" aria-label="Remove">✕</button>
    </span>
  </template>
  <p class="error" role="alert" aria-live="assertive" id="recipients-error"></p>
  <p class="description" aria-live="polite" id="recipients-description">
    Each entry must be a valid email address.
  </p>
  <p class="status visually-hidden" role="status" aria-live="polite"></p>
</form-tokenbox>

<hr>

<!-- The client message channel (ADR 0030 s9, LT-219): the status and
     duplicate messages are built at event time in the browser, so the server
     render serializes those keys, translated and parsed, into the root
     `i18n` attribute. This instance is `renderFormTokenbox()`'s output at
     `de`; the instances above carry no attribute and speak the source
     locale, exactly as a client-created instance would. -->
<form-tokenbox id="german-test" name="farben" lang="de" i18n="{&quot;added&quot;:[&quot;Token hinzugefügt: &quot;,{&quot;t&quot;:&quot;arg&quot;,&quot;a&quot;:&quot;token&quot;}],&quot;duplicate&quot;:[{&quot;t&quot;:&quot;arg&quot;,&quot;a&quot;:&quot;token&quot;},&quot; ist bereits in der Liste&quot;],&quot;removed&quot;:[&quot;Token entfernt: &quot;,{&quot;t&quot;:&quot;arg&quot;,&quot;a&quot;:&quot;token&quot;}]}">
  <label for="farben-input">Farben</label>
  <div class="input" data-container>
    <input type="text" id="farben-input" data-unreconciled>
  </div>
  <template>
    <span class="token" data-key>
      <span class="token-label"><slot></slot></span>
      <button type="button" class="remove" aria-label="Entfernen">✕</button>
    </span>
  </template>
  <p class="error" role="alert" aria-live="assertive"></p>
  <p class="status visually-hidden" role="status" aria-live="polite"></p>
</form-tokenbox>
