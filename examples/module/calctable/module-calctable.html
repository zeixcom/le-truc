<!-- Regenerated from the compiled server render (LT-109 cutover):
     renderModuleCalctable({ lang, options, rows }) from
     server/generated/components/module-calctable.server.ts — the demo serves exactly
     the markup the compiled client hydrates. The variant set serves
     module-calctable.tsx (ADR 0039); module-calctable.tsrx and the hand-written
     module-calctable.ts stay as variants. The rows are the per-field harvest
     sites (ADR 0046 s7): the key from data-key, description/amount/price-per-unit
     from the inputs' value sites. The per-row and total prices compose
     <basic-number>, whose raw value arrives through the pass at mount; the
     text below is the steady state for the un-upgraded page. The item
     template's data-key and the entry row are the LT-186 shape. -->
<module-calctable lang="en" options='{"style":"currency","currency":"CHF"}'>
	<table>
		<thead>
			<tr>
				<th class="description" scope="col">Description</th>
				<th class="amount" scope="col">Amount</th>
				<th class="price-per-unit" scope="col">Price/Unit</th>
				<th class="price" scope="col">Price</th>
			</tr>
		</thead>
		<tbody data-container>
			<tr data-key="item1">
				<td class="description">
					<input type="text" value="Widget" aria-label="Description" class="description">
				</td>
				<td class="amount">
					<input
						type="number"
						min="0"
						max="100"
						step="1"
						inputmode="numeric"
						value="3"
						aria-label="Amount"
						class="amount"
					>
				</td>
				<td class="price-per-unit">
					<input
						type="number"
						min="0"
						max="1000"
						step="0.01"
						inputmode="decimal"
						value="12.5"
						aria-label="Price per unit"
						class="price-per-unit"
					>
				</td>
				<td class="price">
					<basic-number value="0" lang="en" options='{"style":"currency","currency":"CHF"}'>CHF 37.50</basic-number>
				</td>
			</tr>
			<tr data-key="item2">
				<td class="description">
					<input type="text" value="Gadget" aria-label="Description" class="description">
				</td>
				<td class="amount">
					<input
						type="number"
						min="0"
						max="100"
						step="1"
						inputmode="numeric"
						value="5"
						aria-label="Amount"
						class="amount"
					>
				</td>
				<td class="price-per-unit">
					<input
						type="number"
						min="0"
						max="1000"
						step="0.01"
						inputmode="decimal"
						value="8"
						aria-label="Price per unit"
						class="price-per-unit"
					>
				</td>
				<td class="price">
					<basic-number value="0" lang="en" options='{"style":"currency","currency":"CHF"}'>CHF 40.00</basic-number>
				</td>
			</tr>
			<tr data-unreconciled>
				<td class="description">
					<input
						type="text"
						placeholder="New item"
						aria-label="Description"
						class="entry-description"
					>
				</td>
				<td class="amount">
					<input
						type="number"
						min="0"
						max="100"
						step="1"
						inputmode="numeric"
						aria-label="Amount"
						class="entry-amount"
					>
				</td>
				<td class="price-per-unit">
					<input
						type="number"
						min="0"
						max="1000"
						step="0.01"
						inputmode="decimal"
						aria-label="Price per unit"
						class="entry-price"
					>
				</td>
				<td class="price"></td>
			</tr>
		</tbody>
		<tfoot>
			<tr>
				<td class="description">Total</td>
				<td class="amount-total">8</td>
				<td class="price-per-unit total"></td>
				<td class="price-total">
					<basic-number class="total-price" value="0" lang="en" options='{"style":"currency","currency":"CHF"}'>CHF 77.50</basic-number>
				</td>
			</tr>
		</tfoot>
	</table>
	<template data-list="0">
		<tr>
			<td class="description">
				<input type="text" aria-label="Description" class="description">
			</td>
			<td class="amount">
				<input
					type="number"
					min="0"
					max="100"
					step="1"
					inputmode="numeric"
					aria-label="Amount"
					class="amount"
				>
			</td>
			<td class="price-per-unit">
				<input
					type="number"
					min="0"
					max="1000"
					step="0.01"
					inputmode="decimal"
					aria-label="Price per unit"
					class="price-per-unit"
				>
			</td>
			<td class="price">
				<basic-number value="0" lang="en" options='{"style":"currency","currency":"CHF"}'></basic-number>
			</td>
		</tr>
	</template>
</module-calctable>
