<module-catalog id="default-test">
	<header>
		<p>Shop</p>
		<basic-button disabled>
			<button type="button" disabled>
				<span class="label">🛒 Shopping Cart</span>
				<span class="badge"></span>
			</button>
		</basic-button>
	</header>
	<ul>
		<li>
			<p>Product 1</p>
			<form-spinbutton data-product="product-1">
				<fieldset>
					<button type="button" class="decrement" aria-label="Decrement" hidden>
						−
					</button>
					<input
						id="product-1-quantity-input"
						type="number"
						class="value"
						value="0"
						min="0"
						max="10"
						aria-label="Quantity"
						hidden
					>
					<button type="button" class="increment" aria-label="Increment">
						<span class="zero">Add to Cart</span>
						<span class="other" hidden>+</span>
					</button>
				</fieldset>
				<p class="error" role="alert" aria-live="assertive"></p>
			</form-spinbutton>
		</li>
		<li>
			<p>Product 2 <small>(reduced stock on checkout)</small></p>
			<form-spinbutton data-product="product-2">
				<fieldset>
					<button type="button" class="decrement" aria-label="Decrement" hidden>
						−
					</button>
					<input
						id="product-2-quantity-input"
						type="number"
						class="value"
						value="0"
						min="0"
						max="5"
						aria-label="Quantity"
						hidden
					>
					<button type="button" class="increment" aria-label="Increment">
						<span class="zero">Add to Cart</span>
						<span class="other" hidden>+</span>
					</button>
				</fieldset>
				<p class="error" role="alert" aria-live="assertive"></p>
			</form-spinbutton>
		</li>
		<li>
			<p>Product 3 <small>(sold out on checkout)</small></p>
			<form-spinbutton data-product="product-3">
				<fieldset>
					<button type="button" class="decrement" aria-label="Decrement" hidden>
						−
					</button>
					<input
						id="product-3-quantity-input"
						type="number"
						class="value"
						value="0"
						min="0"
						max="20"
						aria-label="Quantity"
						hidden
					>
					<button type="button" class="increment" aria-label="Increment">
						<span class="zero">Add to Cart</span>
						<span class="other" hidden>+</span>
					</button>
				</fieldset>
				<p class="error" role="alert" aria-live="assertive"></p>
			</form-spinbutton>
		</li>
	</ul>
</module-catalog>
