<module-todo>
	<form action="#">
		<form-textbox>
			<label for="add-todo">What needs to be done?</label>
			<div class="input">
				<input id="add-todo" type="text" value="">
				<button type="button" class="clear" aria-label="Clear input" hidden>
					✕
				</button>
			</div>
		</form-textbox>
		<basic-button class="submit">
			<button type="submit" class="constructive" disabled>
				<span class="label">Add Todo</span>
			</button>
		</basic-button>
	</form>
	<span role="status" class="visually-hidden"></span>
	<ol data-container></ol>
	<template>
		<li>
			<button
				type="button"
				class="reorder"
				aria-label="Drag to reorder"
				aria-pressed="false"
			>
				≡
			</button>
			<form-checkbox class="todo">
				<input type="checkbox" class="visually-hidden">
				<!-- Compiled form-inplace-edit (LT-092 cutover): span.text +
				     div.edit > form-textbox(name="") + toggle button; the label
				     text arrives via module-todo's pass() into host.value -->
				<form-inplace-edit>
					<label class="label"><span class="text"><slot></slot></span></label>
					<div class="edit" hidden>
						<form-textbox name="">
							<label for="-input">Edit</label>
							<div class="input">
								<input type="text" id="-input" autocomplete="off">
							</div>
						</form-textbox>
					</div>
					<button type="button" aria-label="Edit">✎</button>
				</form-inplace-edit>
			</form-checkbox>
			<basic-button class="remove">
				<button
					type="button"
					class="tertiary destructive small"
					aria-label="Remove"
				>
					<span class="label">✕</span>
				</button>
			</basic-button>
		</li>
	</template>
	<footer>
		<!-- Regenerated for the LT-115 basic-pluralize cutover: the compiled
		     component requires all six CLDR category spans in hydrated
		     markup; English never matches zero/two/few/many, so they stay
		     empty and permanently hidden. -->
		<basic-pluralize>
			<p class="none">Well done, all done!</p>
			<p class="some">
				<span class="count"></span>
				<span class="zero"></span><span class="one"> task</span
				><span class="two"></span><span class="few"></span
				><span class="many"></span><span class="other"> tasks</span>
				remaining
			</p>
		</basic-pluralize>
		<form-radiogroup value="all" class="split-button">
			<fieldset>
				<legend class="visually-hidden">Filter</legend>
				<label class="selected">
					<input type="radio" class="visually-hidden" value="all" checked>
					<span>All</span>
				</label>
				<label>
					<input type="radio" class="visually-hidden" value="active">
					<span>Active</span>
				</label>
				<label>
					<input type="radio" class="visually-hidden" value="completed">
					<span>Completed</span>
				</label>
			</fieldset>
		</form-radiogroup>
		<basic-button class="clear-completed">
			<button type="button" class="tertiary destructive">
				<span class="label">Clear Completed</span>
				<span class="badge"></span>
			</button>
		</basic-button>
	</footer>
</module-todo>
