<!-- The page context of the platform-CSS contract probe (LT-501): the page
     rules below are the page side of the comparisons — a page TYPE
     selector that LOSES to the probe's `:scope` host rule (a pseudo-class
     outweighs a type) and BEATS its `:where(:scope)` one, and a page class
     rule that reaches the light-DOM component's internals (the permanent
     inward-reach difference from a real shadow root, ADR 0033). The
     `<p class="probe-global">` outside the component is the unscoped
     rule's page-wide proof, and the `<p class="tag-led">` outside it
     shows the tag-led rule stays contained. `#page-child`, absent from the
     template, is a page-authored child the component's own rules style. The
     `css-probe-child` inside the probe is a compose site with children
     (ADR 0048): its `code` carries the region marker the server writes.
     The second, page-rendered `css-probe-child` carries none and renders
     the same, because the marker adds no CSS. -->
<style>
	css-probe {
		border-top-color: rgb(0, 128, 0);
		outline-color: rgb(0, 0, 255);
	}

	.label {
		letter-spacing: 3px;
	}
</style>

<css-probe id="probe">
	<p class="label">Label</p>
	<p class="probe-global">Global</p>
	<p class="tag-led">Tag-led</p>
	<basic-button id="child">
		<button type="button" class="secondary medium">
			<span class="label">Child button</span>
			<span class="badge"></span>
		</button>
		<span>Page content</span>
	</basic-button>
	<button type="button" class="own">Own</button>
	<css-probe-child>
		<pre><code data-children="css-probe"><span class="x">Kid</span><x-kid-widget><button type="button"><span>Kid button</span></button></x-kid-widget></code></pre>
		<span class="x">Child internal</span>
	</css-probe-child>
	<p class="label" id="page-child">Page child</p>
</css-probe>

<p class="probe-global" id="outside-global">Global, outside the component</p>
<p class="tag-led" id="outside-tag-led">Tag-led, outside the component</p>

<css-probe-child id="page-probe-child">
	<pre><code><span class="x" id="page-kid">Page kid</span></code></pre>
	<span class="x">Child internal</span>
</css-probe-child>
