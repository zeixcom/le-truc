<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>PoC — harness probe: attribute vs internals semantics</title>
	</head>
	<body>
		<h1>LT-001 probe</h1>
		<!-- internals only: role + label + valuenow as default semantics -->
		<poc-probe id="via-internals" mode="internals"></poc-probe>
		<!-- attribute only: the same semantics via content attributes -->
		<poc-probe
			id="via-attribute"
			mode="attribute"
			role="progressbar"
			aria-label="Attribute only"
			aria-valuenow="7"
		></poc-probe>
		<!-- both: internals defaults overridden by content attributes -->
		<poc-probe
			id="via-both"
			mode="both"
			role="progressbar"
			aria-label="Attribute wins"
			aria-valuenow="99"
		></poc-probe>
		<script type="module" src="/poc/poc-basic.js"></script>
	</body>
</html>
