<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>LT-005: element-internals-declaration registration</title>
	</head>
	<body>
		<h1>Registration probes</h1>

		<!-- Trap: internals.role='button', no native <button>, plus an
		     aria-checked content attribute that is invalid for the button role
		     (a consumer authoring mistake, independent of the internals
		     wiring). Silent-pass before the registry sees it; flagged
		     (aria-allowed-attr) once it does. -->
		<poc-reg-button-trap id="btn-trap" aria-checked="true"
			>Trap button</poc-reg-button-trap
		>

		<!-- Control: same registration, no invalid attribute — must NOT be
		     flagged, proving registration doesn't blanket-flag every
		     internals-role element. -->
		<poc-reg-button-ok id="btn-ok">OK button</poc-reg-button-ok>

		<!-- Pre-LT-005 baseline: identical trap, never registered — the actual
		     "before" comparison (see poc-truc-registration.ts docstring for
		     why deleting a registry entry mid-session doesn't work). -->
		<poc-unreg-button-trap id="btn-unreg" aria-checked="true"
			>Unregistered trap button</poc-unreg-button-trap
		>

		<!-- Reused for the connect/disconnect/reconnect identity test. -->
		<div id="cycle-host"></div>

		<script type="module" src="/poc/poc-truc-registration.js"></script>
	</body>
</html>
